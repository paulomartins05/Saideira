
name: Pipeline CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Linting
        run: npm run lint

  test:
    name: Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Testes Unitários (Vitest)
        run: npx vitest run

  build:
    name: Build da Aplicação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Build da Aplicação
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Adicione as variáveis de ambiente necessárias para o build do Next.js
          # DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}


  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: saideira_test
        options: >-
          --health-cmd "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps

      - name: Preparar Banco de Dados e Prisma
        run: |
          npx prisma generate
          npx prisma db push
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/saideira_test?schema=public

      - name: Rodar Testes E2E
        run: npx playwright test
        env:
          RESEND_API_KEY: "re_dummy_key_e2e"
          NEXT_PUBLIC_URL: http://127.0.0.1:3000
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/saideira_test?schema=public
          BETTER_AUTH_SECRET: "chave-secreta-de-mentirinha"
