
name: Pipeline CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint, Testes e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Linting
        run: npm run lint

      - name: Testes Unitários (Vitest)
        run: npx vitest run

      - name: Build da Aplicação
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Adicione as variáveis de ambiente necessárias para o build do Next.js
          # DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Rodar Testes E2E
        run: npx playwright test
